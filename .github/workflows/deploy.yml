on:
  push:
    branches: [ main ]

jobs:
  deploy: 
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with: 
          push: true
          tags:  375740441275.dkr.ecr.us-east-1.amazonaws.com/workout-tracker:latest

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,prometheus.yml"
          target: "~/Workout_tracker"

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: | 
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 375740441275.dkr.ecr.us-east-1.amazonaws.com
            cd Workout_tracker
            sudo docker compose down
            sudo docker compose up -d --pull always
